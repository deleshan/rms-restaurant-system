services:
  caddy:
    image: caddy:2
    container_name: neodemeter-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: neodemeter-backend
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/dialogflow-key.json:/app/dialogflow-key.json:ro
      - uploads_data:/app/uploads

volumes:
  uploads_data:
  caddy_data:
  caddy_config: