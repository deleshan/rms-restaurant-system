
services:
  backend:
    build: ./backend
    container_name: restosync-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/dialogflow-key.json:/app/dialogflow-key.json:ro
      - uploads_data:/app/uploads
    depends_on:
      - python-ai-service
    environment:
      - PYTHON_AI_URL=http://python-ai-service:5001

  python-ai-service:
    build: ./python-ai-service
    container_name: restosync-ai
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./python-ai-service/.env

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: restosync-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "8081:8081"
      - "8082:8082"
    depends_on:
      - backend

volumes:
  uploads_data: